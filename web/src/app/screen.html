<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Screen — Deal Origination Engine</title>
<link rel="stylesheet" href="app.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📇</text></svg>" />
</head>
<body data-page="screen">
<div class="shell">
<header class="app-header" id="app-header"></header>

<div class="fpanel">
  <div class="f-search"><input type="search" id="f-q" placeholder="Search company name or registration number…  ( / )" autocomplete="off"></div>

  <div class="f-grid">
    <div class="f-col">
      <label class="f-label">Sector <span class="f-hint" id="f-sectors-hint"></span></label>
      <div class="sector-list" id="f-sectors"></div>
    </div>
    <div class="f-col">
      <label class="f-label">Ownership class</label>
      <select id="f-own">
        <option value="">any</option>
        <option value="owner_managed">owner managed</option>
        <option value="independent">independent</option>
        <option value="sponsor_backed">sponsor backed</option>
        <option value="unclassifiable">unclassifiable</option>
      </select>
      <label class="f-label">Screening mode</label>
      <select id="f-mode"><option value="">any</option><option value="financial">financial</option><option value="signal">signal</option><option value="parse_failed">parse_failed</option></select>
    </div>
    <div class="f-col">
      <label class="f-label">EBITDA band £ <span class="f-hint" title="EBITDA is a Phase 2 derived figure; until it exists every company is 'could not be measured' for this test.">derived · P2</span></label>
      <div class="f-band"><input type="number" id="f-eb-min" placeholder="min"><input type="number" id="f-eb-max" placeholder="max"></div>
      <label class="f-label">Revenue band £</label>
      <div class="f-band"><input type="number" id="f-rev-min" placeholder="min"><input type="number" id="f-rev-max" placeholder="max"></div>
    </div>
    <div class="f-col">
      <label class="f-label">Region</label>
      <select id="f-country"></select>
      <input type="text" id="f-loc" placeholder="town / locality contains…">
    </div>
    <div class="f-col">
      <label class="f-label">Owner age over</label>
      <input type="number" id="f-owner-min" placeholder="e.g. 55">
      <label class="f-label">Figures no older than (months)</label>
      <input type="number" id="f-stale" placeholder="e.g. 18">
    </div>
  </div>

  <div class="chips" id="chips">
    <span class="chip" data-toggle="nosucc" id="chip-nosucc"
      title="Observable form of 'no successor appointed': no active officer appointed within the last five years. Companies with no officer records count as could-not-be-measured.">No officer appointed in 5y</span>
    <span class="chip" data-toggle="single75" id="chip-single75"
      title="A single active person with significant control holds 75–100% of shares — the observable proxy for owner-managed. Companies with no PSC records count as could-not-be-measured.">Single PSC holds 75–100%</span>
    <span class="chip" id="chip-fresh18" title="Sets the staleness cutoff to 18 months.">Accounts under 18 months old</span>
    <span class="chipsep">observed in the last 12 months:</span>
    <span class="chip" data-obs="security_interest_registered" title="A charge (security interest) was registered within the last 12 months.">charge registered</span>
    <span class="chip" data-obs="officer_resigned" title="An officer resignation was filed within the last 12 months.">officer resigned</span>
    <span class="chip" data-obs="psc_ceased" title="A person with significant control ceased within the last 12 months.">PSC ceased</span>
    <span class="chip" data-obs="restatement" title="A later filing restated a previously filed figure (any time).">restated</span>
    <span class="chip inert" title="Going-concern language, auditor resignation and overdue-filing detectors are Phase 2 — not_reached.">+ P2 detectors</span>
    <a href="#" id="f-clear" class="clear">clear all</a>
  </div>
</div>

<div id="countblock"></div>
<div id="results"><div class="loading">Loading the store index…</div></div>

<footer class="app-footer"><p id="app-footer"></p></footer>
</div>
<script src="site-summary.js"></script>
<script src="sic-groups.js"></script>
<script src="core.js"></script>
<script src="screen.js"></script>
</body>
</html>
