<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Screen — Deal Origination Engine</title>
<link rel="stylesheet" href="app.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📇</text></svg>" />
</head>
<body data-page="screen">
<div class="shell">
<header class="app-header">
  <div>
    <h1>Screen</h1>
    <p class="crumb">Thesis builder — filters narrow the ingested universe; every figure traces to its filing</p>
  </div>
  <nav class="top-nav"><a href="../">Engine</a><a class="here" href="screen.html">Screen</a><a href="../ops/">Operations</a></nav>
</header>

<div class="screen-grid">
  <aside class="rail">
    <h3>Search</h3>
    <div class="f-row"><input type="search" id="f-q" placeholder="name or company number"></div>

    <h3>Sector</h3>
    <div class="sector-list" id="f-sectors"></div>

    <h3>Size</h3>
    <div class="f-row"><label>revenue £ (latest filed)</label>
      <div class="f-band"><input type="number" id="f-rev-min" placeholder="min"><input type="number" id="f-rev-max" placeholder="max"></div></div>
    <div class="f-row"><label>employees</label>
      <div class="f-band"><input type="number" id="f-emp-min" placeholder="min"><input type="number" id="f-emp-max" placeholder="max"></div></div>
    <div class="f-row"><label>net assets £</label>
      <div class="f-band"><input type="number" id="f-na-min" placeholder="min"><input type="number" id="f-na-max" placeholder="max"></div></div>
    <div class="f-row f-inert" title="EBITDA is a Phase 2 derived figure — no values exist yet, so this filter cannot run. It will enable when the derive layer lands.">
      <label>EBITDA £ <span class="state st-not_reached">not_reached</span></label>
      <div class="f-band"><input type="number" placeholder="min" disabled><input type="number" placeholder="max" disabled></div></div>

    <h3>Region</h3>
    <div class="f-row"><select id="f-country"></select></div>
    <div class="f-row"><input type="text" id="f-locality" placeholder="town / locality contains…"></div>

    <h3>Company</h3>
    <div class="f-row"><label>company age, years</label>
      <div class="f-band"><input type="number" id="f-age-min" placeholder="min"><input type="number" id="f-age-max" placeholder="max"></div></div>
    <div class="f-row"><label>screening mode</label>
      <select id="f-mode"><option value="">any</option><option value="financial">financial</option><option value="signal">signal</option><option value="parse_failed">parse_failed</option></select></div>
    <div class="f-row f-inert" title="Ownership classification is Phase 2 and fail-closed — every company is currently unclassified, so this filter cannot run.">
      <label>ownership class <span class="state st-not_reached">not_reached</span></label>
      <select disabled><option>owner-managed / independent / sponsor-backed</option></select></div>

    <h3>Succession</h3>
    <div class="f-row"><label>owner age at least (~, from PSC birth year)</label>
      <input type="number" id="f-owner-min" placeholder="e.g. 60"></div>
    <div class="f-row f-inert" title="Younger-officer and single-shareholder succession detectors are Phase 2 signal rules.">
      <label>succession detectors <span class="state st-not_reached">not_reached</span></label>
      <select disabled><option>no younger officer / single shareholder</option></select></div>

    <h3>Financial &amp; distress</h3>
    <div class="f-row"><label>security interests outstanding</label>
      <select id="f-charges"><option value="">any</option><option value="yes">has outstanding</option><option value="no">none outstanding</option></select></div>
    <div class="f-row f-inert" title="Margin, growth and gearing are Phase 2 derived figures; distress-language extraction (going concern, auditor resignation) is Phase 2 signal work.">
      <label>margin / growth / gearing / distress <span class="state st-not_reached">not_reached</span></label>
      <select disabled><option>—</option></select></div>

    <h3>Data quality</h3>
    <div class="f-row"><label>exclude figures older than (months)</label>
      <input type="number" id="f-stale" placeholder="e.g. 24"></div>
    <div class="f-row f-inert" title="Plausibility flags are Phase 2 (design approved).">
      <label>exclude plausibility-flagged <span class="state st-not_reached">not_reached</span></label>
      <select disabled><option>—</option></select></div>
    <div class="f-row"><label><input type="checkbox" id="f-watch"> watchlist only</label></div>

    <p class="f-row"><a href="#" id="f-clear" class="clear">clear all filters</a></p>
  </aside>

  <div>
    <div class="countbar" id="countbar"></div>
    <div id="results"></div>
  </div>
</div>

<footer class="app-footer"><p id="app-footer"></p></footer>
</div>
<script src="../demo/demo-data.js"></script>
<script src="site-summary.js"></script>
<script src="sic-groups.js"></script>
<script src="app.js"></script>
</body>
</html>
