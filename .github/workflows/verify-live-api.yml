name: live-api-verification

# Manually triggered: Actions tab -> live-api-verification -> Run workflow.
# Requires the CH_API_KEY repository secret
# (Settings -> Secrets and variables -> Actions -> New repository secret).
# Runs the numbered protocol from docs/live-api-verification.md and
# uploads the report + raw responses + saved accounts documents as a
# downloadable artifact. ~25 API calls, far below the rate limit.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CH_API_KEY: ${{ secrets.CH_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secret present
        run: |
          if [ -z "$CH_API_KEY" ]; then
            echo "CH_API_KEY secret is not set. Add it under:"
            echo "  repo Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

      - name: Run verification protocol
        run: bash scripts/verify_live_api.sh out

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-api-verification
          path: out/
          if-no-files-found: error

      # Also commit the results to the branch this workflow ran on, so
      # environments that cannot reach the artifact CDN can fetch them
      # via git. Response data only — no request credentials are stored.
      - name: Commit results to branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898024+github-actions[bot]@users.noreply.github.com"
          mkdir -p evals/golden/seed
          cp -r out/. evals/golden/seed/
          git add evals/golden/seed
          git commit -m "Live API verification results (run ${{ github.run_id }})"
          git push
