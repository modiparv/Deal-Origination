[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-engine"
version = "0.1.0"
description = "Mandate-driven deal origination engine with document-level provenance"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "ixbrlparse>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
deal-engine = "deal_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["src"]
